services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: career, POSTGRES_PASSWORD: career, POSTGRES_DB: career}
    ports: ["5432:5432"]
  api:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://career:career@db:5432/career
    ports: ["8000:8000"]
    depends_on: [db]
